name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Each machine against etcetc000/open-xy staging, which has everything the
  # three need (aux modules #221, effect pages and screens #230). Each checks
  # its records, browser preview, drawing checks and host tests. The native
  # compile needs the pinned Blackfin tools, which this Linux runner doesn't
  # have.
  machines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: [omnifilter, lint, chroma]
    steps:
      - uses: actions/checkout@v4
        with:
          path: macro
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: staging
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Machine source, preview and host checks
        run: python open-xy/sdk.py test --machine "macro/${{ matrix.machine }}" --cxx clang++ --host-cxx g++
