name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Each machine against the SDK branch with aux modules, effect pages and
  # effect screens (etcetc000/open-xy#221 and the branch on it) until they
  # merge: its records, browser preview, drawing checks and host tests. The
  # native compile needs the pinned Blackfin tools, which this Linux runner
  # doesn't have.
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: macro
      - uses: actions/checkout@v4
        with:
          repository: mmockett/open-xy
          ref: sdk/effect-screens
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Machine source, preview and host checks
        run: |
          for machine in omnifilter lint; do
            python open-xy/sdk.py test --machine "macro/$machine" --cxx clang++ --host-cxx g++ || exit 1
          done
